<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title != "Home" %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">

<header class="site-header">
  <a class="brand" href="./">
    <img class="logo" src="images/duck-rabbit.jpg" alt="Duck-rabbit illusion" width="108" height="69">
    <span class="brand-text">
      <span class="site-title">{{ site.title }}</span>
      <span class="tagline">Community population genetics<br>City College of New York · CUNY Graduate Center</span>
    </span>
  </a>
  <nav aria-label="Site">
    <a href="./"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
    <a href="people.html"{% if page.url == "/people.html" %} aria-current="page"{% endif %}>People</a>
    <a href="teaching-software.html"{% if page.url == "/teaching-software.html" %} aria-current="page"{% endif %}>Teaching &amp; Software</a>
    <a href="https://scholar.google.com/citations?hl=en&amp;user=XaY6DN8AAAAJ&amp;view_op=list_works&amp;sortby=pubdate">Publications ↗</a>
    <a href="https://sasquatchandyetivariations.bandcamp.com">Music ↗</a>
  </nav>
</header>

<main class="page-{{ page.title | slugify }}">
{{ content }}
</main>

<footer class="site-footer">
  <p>the hickerlab · Department of Biology, City College of New York · mhickerson at ccny dot cuny dot edu</p>
</footer>

</div>
</body>
</html>
